    const showAll = showMine ? `<p class="fine">Showing ${pl(restMU, 'event')} at or one step above ${S.partners.length ? 'your (and your team’s) levels' : specificCount() ? 'your levels' : rt(R)}. <button class="linkbtn" data-act="evmine">Show all ${rest.length}</button></p>` : '';
    const counts = `${events.length}${R != null ? ` · ${mineCount} your level${upCount ? ` · ${upCount} play up` : ''}` : ''}`;
    const fnote = !fon ? '' : filtering
      ? `<p class="fine fnote">${rest.length ? `Showing ${pl(rest.length, 'event')} that ${rest.length === 1 ? 'matches' : 'match'} your filters (${esc(filterWords())}).` : `None of the events match your filters (${esc(filterWords())}).`} <button class="linkbtn" data-act="evall">Show all ${restAll.length}</button></p>`
      : `<p class="fine fnote">Showing all ${restAll.length} events. <button class="linkbtn" data-act="evall">Only show ${esc(filterWords())}</button></p>`;
    h += `<div class="blk"><h3><span>Events <small>${filtering ? `${rest.length} of ${events.length}` : counts}</small></span>${toggle}</h3>
      ${fnote}${grouped(rest)}${showAll}</div>`;
    if(R != null && !S.partners.length && tagged.some(e => pKindOf(fmtOf(e)))) h += `<p class="fine">Playing with a partner? <button class="linkbtn" data-act="go-partners">Add their rating</button> and Bracket finds your team's level.</p>`;
  } else if(loading){
    h += '<div class="skel" style="margin:16px 0"></div>';
  } else if(data && !events.length){
    h += `<div class="blk"><h3>Events</h3><p class="desc">${data.eventsError ? "Couldn't load the events list." : 'No events listed yet.'} See them on <a href="${PT}/tournaments/${esc(slug)}/events" target="_blank" rel="noopener">pickleballtournaments.com</a>.</p></div>`;
  }

  // ---- Cost: what the organizer wrote about fees
  const desc = cleanText(det.description);
  const fees = feeLines(desc);
  if(fees.length || (tt.costPerEvent && !tt.free && data)){
    h += `<div class="blk cost"><h3>Cost${fees.length ? '<small>from the organizer</small>' : ''}</h3>${fees.length ? `<ul>${fees.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : `<p class="desc" style="margin:0">Each event costs extra on top of the $${Math.round(curPrice || 0)} registration. The organizer didn't list event prices here, so check on their site.</p>`}</div>`;
  }

  // ---- Where
  if(det.venue || det.street || tt.location){
    const lines = [det.street, det.cityStateZip].filter(Boolean).join(', ') || tt.location;
    const q2 = [det.venue, det.street, det.cityStateZip].filter(Boolean).join(', ') || tt.location;
    h += `<div class="blk"><h3>Where</h3><div class="addr"><b>${esc(det.venue || tt.city || 'Venue')}</b><span>${esc(lines)}</span></div>
      <div class="btnrow"><a class="btn sm ghost" href="${esc(mapsUrl(q2, det.lat, det.lng))}" target="_blank" rel="noopener">${icon('pin')}Open in Maps</a>${det.website && /^https?:/i.test(det.website) ? `<a class="btn sm ghost" href="${esc(det.website)}" target="_blank" rel="noopener">${icon('globe')}Website</a>` : ''}</div></div>`;
  } else if(loading){
    h += '<div class="skel sm" style="margin:16px 0"></div>';
  }

  // ---- Find a partner: one quiet row; the list opens in its own sheet
  if(sb && tt.startDay && !isPast(tt)){
    const n = (partner.bySlug[slug] || []).filter(p => p.status === 'open' && !(acct.user && p.user_id === acct.user.id)).length;
    h += `<button class="prow" data-act="p-open" data-slug="${esc(slug)}">${icon('people')}<span>Need a partner?<small>${n ? pl(n, 'player') + ' looking' : "See who's looking, or post"}</small></span>${icon('chev', 'i chev')}</button>`;
  }

  // ---- About
  if(desc || det.prizeInfo){
    h += `<div class="blk"><h3>About</h3>${det.prizeInfo ? `<p class="desc" style="margin:0 0 8px"><b>Prize:</b> ${esc(cleanText(det.prizeInfo))}</p>` : ''}${desc ? `<div class="desc${ui.descOpen || desc.length < 420 ? '' : ' clamp'}">${esc(desc)}</div>${!ui.descOpen && desc.length >= 420 ? '<button class="linkbtn" data-act="more" style="margin-top:6px">Show more</button>' : ''}` : ''}</div>`;
  }
  h += `<p class="end-note">Details from pickleballtournaments.com${data && DET[slug] ? ', ' + relAgo(DET[slug].at) : ''}. Double-check on their site before you sign up.</p>`;
  return h;
}

/* ---------------- Notifications ----------------
   Web Push: works on iPhone only from the Home Screen app (iOS 16.4+), on Android in Chrome, and on computers.
   Signed-in only: the hourly server check (api/cron.js) reads your saved tournaments to decide what to send.
   Settings → Notifications sets the types; each saved tournament can override them (its "alerts" in the save). */
const NOTIFY_TYPES = [
  ['partner', 'Partner requests', 'When someone asks to team up with you'],
  ['tomorrow', 'Tournament tomorrow', 'The day before a tournament you marked registered'],
  ['closing', 'Registration closing', '2 days before sign-up closes, if you haven’t registered yet'],
  ['early', 'Early-bird price ending', 'The day before the price goes up'],
  ['changes', 'Changes', 'Price, dates or registration changed (off to start)']
];
const pushState = { checked: false, supported: false, on: false, busy: false };
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64u(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function checkPush(){
  pushState.supported = pushSupported();
  if(!pushState.supported){ pushState.checked = true; return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    pushState.on = !!sub && Notification.permission === 'granted';
  } catch(e){ pushState.on = false; }
  pushState.checked = true;
}
async function enablePush(){
  if(!pushSupported()){
    if(isIOS() && !isStandalone()){ toast('On iPhone, add Bracket to your Home Screen first. Then turn notifications on.'); openInstall(); }
    else toast('This browser can’t show notifications.');
    return;
  }
  if(!acct.user){ toast('Sign in first, so Bracket knows which tournaments to tell you about.'); setTimeout(signIn, 900); return; }
  if(!ui.config || !ui.config.push){ toast('Notifications aren’t set up yet.'); return; }
  pushState.busy = true; renderSettings();
  try {
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      toast(perm === 'denied' ? 'Notifications are blocked for Bracket. Turn them on in your phone’s Settings → Notifications → Bracket.' : 'Notifications weren’t turned on.');
      return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(ui.config.push) }));
    const j = sub.toJSON();
    const { error } = await sb.from('bracket_push_subs').upsert({ user_id: acct.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if(error) throw error;
    pushState.on = true;
    toast('Notifications are on for this device.');
  } catch(e){
    toast('Couldn’t turn on notifications. Please try again.');
  } finally { pushState.busy = false; renderSettings(); }
}
async function disablePush(){
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ if(sb && acct.user) await sb.from('bracket_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch(e){}
  pushState.on = false; renderSettings(); toast('Notifications are off for this device.');
}
async function testPush(btn){
  if(!acct.session) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + acct.session.access_token }, body: JSON.stringify({ action: 'test' }) });
    const j = await r.json().catch(() => ({}));
    toast(r.ok && j.sent ? 'Sent! It should pop up in a few seconds.' : (j.error || 'Couldn’t send a test right now.'));
  } catch(e){ toast('Couldn’t reach Bracket.'); }
  btn.disabled = false;
}
// Per-tournament alerts, stored on the saved tournament so they sync with everything else
function savedAlerts(slug){ const s = SAVES.registered[slug] || SAVES.interested[slug]; return s ? (s.alerts == null ? null : s.alerts) : undefined; }
function alertOn(slug, k){ const a = savedAlerts(slug); if(a === 'off') return false; return a && typeof a === 'object' && a[k] != null ? !!a[k] : !!S.notify[k]; }
function setAlerts(slug, val){

/* ---------------- Config + stale-app check ---------------- */
async function loadConfig(){
  try {
    const r = await fetch('/api/config', { cache: 'no-store' });
    if(!r.ok) return;
    const j = await r.json();
    ui.config = j;
    if(j.version && j.version !== VERSION){
      // An old copy of the page (home-screen apps hang on to them). Reload once to get the new one.
      const k = 'bracket_reloaded_' + j.version;
      let done = false; try { done = !!sessionStorage.getItem(k); sessionStorage.setItem(k, '1'); } catch(e){ done = true; }

/* ---------------- Accounts + sync (Supabase, Google sign-in) ----------------
   Signed out: everything stays in this browser, like before.
   First sign-in on a device: this phone's saves merge into the account (the phone's copy wins on a tie).
   After that the account is the source of truth: each change is pushed right away, and the app
   pulls the latest when it opens or you come back to it. Rows are protected by Row Level Security. */
const SB_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
let sb = null;
const acct = { ready: false, session: null, user: null, syncing: false, lastSync: 0, error: null, mirror: null, timer: null, profTimer: null, profSent: null };
const GOOGLE_G = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6c1.9-5.6 7.1-9.8 13.6-9.8z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.5 0-11.7-4.2-13.6-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
function loadScript(src){
  return new Promise((ok, bad) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = ok; el.onerror = () => bad(new Error('load ' + src)); document.head.appendChild(el); });
}
async function initAuth(cfg){
  if(sb || !cfg || !cfg.supabase) return;
  try {
    if(!window.supabase) await loadScript(SB_CDN);
    sb = window.supabase.createClient(cfg.supabase.url, cfg.supabase.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storageKey: 'bracket_auth' } });
    const { data } = await sb.auth.getSession();
    setSession(data && data.session);
    sb.auth.onAuthStateChange((ev, session) => {
      const before = acct.user && acct.user.id;
      setSession(session);
      if(session && before !== session.user.id) pullSync();
      if(ev === 'SIGNED_OUT') acct.mirror = null;
      renderAuthBits();
    });
    acct.ready = true;
    loadPartnerCounts(true);
    if(/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash); // tidy the address after Google
    renderAuthBits();
    if(acct.user) pullSync();
  } catch(e){
    acct.ready = true; acct.error = 'Sign-in isn’t available right now.'; renderAuthBits();
  }
}
function setSession(session){ acct.session = session || null; acct.user = session ? session.user : null; }
const acctName = () => { const u = acct.user; if(!u) return ''; const m = u.user_metadata || {}; return m.full_name || m.name || u.email || 'You'; };
const acctPic = () => { const m = (acct.user && acct.user.user_metadata) || {}; return /^https:\/\//.test(m.avatar_url || m.picture || '') ? (m.avatar_url || m.picture) : ''; };
function avatarHTML(){ const pic = acctPic(); return `<span class="avatar">${pic ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">` : esc((acctName()[0] || '?').toUpperCase())}</span>`; }
function syncText(){
  if(acct.syncing) return 'Syncing…';
  if(acct.error) return acct.error;
  return acct.lastSync ? 'Synced ' + relAgo(acct.lastSync) : 'Synced';
}
function renderSyncLine(){
  document.querySelectorAll('[data-syncline]').forEach(el => { el.innerHTML = `<i class="${acct.error ? 'err' : ''}"></i>${esc(syncText())}`; });
}
function updateMineSub(){ const el = $('#mineSub'); if(el) el.textContent = acct.user ? 'Synced to your account (' + (acct.user.email || 'signed in') + ').' : 'Tournaments you saved, on this phone.'; }
function renderAuthBits(){ updateMineSub(); if(ui.tab === 'settings') renderSettings(); renderSyncLine(); }

async function signIn(){

  try { sessionStorage.setItem('bracket_restore', JSON.stringify({ tab: 'settings', spage: 'account' })); } catch(e){}
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' } });
  if(error) toast('Couldn’t start Google sign-in. Please try again.');
}
async function signOut(){
  if(!sb) return;
  S.syncedUser = null; S.syncDirty = false; save(LS.settings, S);
  // Signed out = no more alerts on this device (they're tied to the account's saves)
  try {
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await sb.from('bracket_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch(e){}
  pushState.on = false;
  try { await sb.auth.signOut(); } catch(e){}
  setSession(null); acct.mirror = null; acct.lastSync = 0;
  partner.myPosts = []; partner.inbox = []; partner.sent = []; renderBadge();
  toast('Signed out. Your saves are still on this phone.');
  renderAuthBits();
}
async function deleteAccount(){
  if(!acct.session) return;
  if(!confirm('Delete your Bracket account? Everything synced to it is erased. This phone keeps its own copy of your saves.')) return;
  try {
    const r = await fetch('/api/account', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + acct.session.access_token }, body: JSON.stringify({ action: 'delete' }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){ toast(j.error || 'Couldn’t delete the account right now.'); return; }
  } catch(e){ toast('Couldn’t reach Bracket. Check your connection.'); return; }
  S.syncedUser = null; S.syncDirty = false; save(LS.settings, S);
  try { await sb.auth.signOut(); } catch(e){}
  setSession(null); acct.mirror = null;
  ui.spage = null; renderAuthBits();
  toast('Your account was deleted.');
}
function localMap(){
  const m = {};
  ['interested', 'registered'].forEach(k => Object.keys(SAVES[k]).forEach(sl => { m[k + '|' + sl] = JSON.stringify(SAVES[k][sl]); }));
  return m;
}
async function pullSync(){
  if(!sb || !acct.user || acct.syncing) return;
  acct.syncing = true; acct.error = null; renderSyncLine();
  const uid = acct.user.id;
  try {
    const [sv, pf] = await Promise.all([
      sb.from('bracket_saves').select('kind,slug,snap'),
      sb.from('bracket_profile').select('*').eq('user_id', uid).maybeSingle()
    ]);
    if(sv.error) throw sv.error;
    if(pf.error) throw pf.error;
    const remote = { interested: {}, registered: {} };
    (sv.data || []).forEach(r => { if(remote[r.kind]) remote[r.kind][r.slug] = r.snap || {}; });
    acct.mirror = {};
    ['interested', 'registered'].forEach(k => Object.keys(remote[k]).forEach(sl => { acct.mirror[k + '|' + sl] = JSON.stringify(remote[k][sl]); }));
    const first = S.syncedUser !== uid || S.syncDirty;
    if(first) SAVES = { interested: Object.assign({}, remote.interested, SAVES.interested), registered: Object.assign({}, remote.registered, SAVES.registered) };
    else SAVES = remote;
    save(LS.saves, SAVES);
    const p = pf.data;
    if(p){
      const pr = p.ratings && typeof p.ratings === 'object' ? p.ratings : null;
      if(first){
        if(S.rating == null && p.rating != null) S.rating = +p.rating;
        if(!S.home && p.home) S.home = p.home;
        if(pr) RKINDS.forEach(k => { if(S.ratings[k[0]] == null && pr[k[0]] != null) S.ratings[k[0]] = +pr[k[0]]; });
        if(!S.partners.length && Array.isArray(p.partners)) S.partners = p.partners.slice(0, 6);
      } else {
        if(Array.isArray(p.partners)) S.partners = p.partners.slice(0, 6);
        S.rating = p.rating != null ? +p.rating : null; S.home = p.home || null; if(p.fit != null) S.fit = p.fit;
        if(pr) RKINDS.forEach(k => { S.ratings[k[0]] = pr[k[0]] != null ? +pr[k[0]] : null; });
        if(p.notify && typeof p.notify === 'object') S.notify = Object.assign({}, NOTIFY_DEFAULTS, p.notify);
      }
      if(first && p.notify && typeof p.notify === 'object' && !S.notifyTouched) S.notify = Object.assign({}, NOTIFY_DEFAULTS, p.notify);
    }
    S.syncedUser = uid; S.syncDirty = false; save(LS.settings, S);
    acct.profSent = null;   // pushProfile compares and skips if nothing changed on the server side next time
    acct.syncing = false;
    await pushSaves();
    await pushProfile();
    acct.lastSync = Date.now();
    loadPartnerMine(true);
    if(first && (sv.data || []).length) toast('Signed in. Your saved tournaments are synced.');
    else if(first) toast('Signed in. Your saves will follow you now.');
  } catch(e){
    acct.error = 'Couldn’t sync right now.';
  } finally {
    acct.syncing = false;
    afterSaveChange();
    renderSyncLine();
    if(ui.tab === 'browse') renderBrowse();
  }
}
function scheduleSync(){
  if(!sb || !acct.user || !acct.mirror) return;
  clearTimeout(acct.timer);
  acct.timer = setTimeout(pushSaves, 400);
}
async function pushSaves(){
  if(!sb || !acct.user || !acct.mirror || acct.syncing) return;
  const uid = acct.user.id, local = localMap(), ups = [], dels = { interested: [], registered: [] };
  Object.keys(local).forEach(k => { if(acct.mirror[k] !== local[k]){ const [kind, slug] = k.split('|'); ups.push({ user_id: uid, kind, slug, snap: JSON.parse(local[k]), updated_at: new Date().toISOString() }); } });
  Object.keys(acct.mirror).forEach(k => { if(!(k in local)){ const [kind, slug] = k.split('|'); dels[kind].push(slug); } });
  if(!ups.length && !dels.interested.length && !dels.registered.length) return;
  try {
    if(ups.length){ const { error } = await sb.from('bracket_saves').upsert(ups, { onConflict: 'user_id,kind,slug' }); if(error) throw error; }
    for(const kind of ['interested', 'registered']){
      if(dels[kind].length){ const { error } = await sb.from('bracket_saves').delete().eq('user_id', uid).eq('kind', kind).in('slug', dels[kind]); if(error) throw error; }
    }
    acct.mirror = local; acct.lastSync = Date.now(); acct.error = null;
  } catch(e){
    S.syncDirty = true; save(LS.settings, S);
    acct.error = 'Couldn’t sync. Will try again.';
  }
  renderSyncLine();
}
function scheduleProfile(){
  if(!sb || !acct.user || acct.syncing) return;
  clearTimeout(acct.profTimer);
  acct.profTimer = setTimeout(pushProfile, 600);
}
async function pushProfile(){
  if(!sb || !acct.user) return;
  const body = { rating: S.rating != null ? S.rating : null, home: S.home || null, fit: S.fit !== false, ratings: S.ratings, notify: S.notify, partners: S.partners };
  const key = JSON.stringify(body);
  if(key === acct.profSent) return;
  try {
    const up = b => sb.from('bracket_profile').upsert(Object.assign({ user_id: acct.user.id, updated_at: new Date().toISOString() }, b), { onConflict: 'user_id' });
    let { error } = await up(body);
    // A newer column whose SQL hasn't been run yet (ratings: 3-ratings.sql, notify: 4-notifications.sql,
    // partners: 6-my-partners.sql): leave it out and sync the rest
    const b2 = Object.assign({}, body);
    for(let i = 0; i < 3 && error; i++){
      const col = ['partners', 'notify', 'ratings'].find(c => c in b2 && new RegExp(c, 'i').test(error.message || ''));
      if(!col) break;
      delete b2[col]; ({ error } = await up(b2));
    }
    if(error) throw error;
    acct.profSent = key;
  } catch(e){ acct.error = 'Couldn’t sync your rating and home.'; renderSyncLine(); }
}

/* ---------------- Find a partner ----------------
   Posts: anyone can read open posts (first name + last initial, rating, event, note).
   Requests: "Ask to team up" sends your name + contact only to that player. Both are
   protected in Supabase (2-partners.sql). New requests show as a badge on Mine. */
const POST_COLS = 'id,slug,title,end_day,event,rating,display_name,note,status,created_at';
const partner = { counts: {}, bySlug: {}, loading: {}, myPosts: [], inbox: [], sent: [], mineAt: 0, countsAt: 0 };
function shortName(){
  const n = acctName().trim();
  if(!n) return '';
  if(n.includes('@')){ const u = n.split('@')[0].replace(/[._-]+/g, ' ').trim(); return u.charAt(0).toUpperCase() + u.slice(1, 20); }
  const parts = n.split(/\s+/);
  return parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1][0].toUpperCase()}.` : parts[0];
}
async function loadPartnerCounts(force){
  if(!sb || (!force && Date.now() - partner.countsAt < 120000)) return;
  partner.countsAt = Date.now();
  const { data, error } = await sb.from('bracket_partner_posts').select('slug').eq('status', 'open').gte('end_day', todayStr());
  if(error) return;
  partner.counts = {};
  (data || []).forEach(r => { partner.counts[r.slug] = (partner.counts[r.slug] || 0) + 1; });
  if(ui.tab === 'browse') renderList();
}
async function loadPartnerPosts(slug){
  if(!sb || partner.loading[slug]) return;
  partner.loading[slug] = true;
  try {
    const { data, error } = await sb.from('bracket_partner_posts').select(POST_COLS + (acct.user ? ',user_id' : '')).eq('slug', slug).order('created_at', { ascending: false });
    if(!error) partner.bySlug[slug] = data || [];
  } finally { partner.loading[slug] = false; refreshOpenDetail(); }
}
async function loadPartnerMine(force){
  if(!sb || !acct.user || (!force && Date.now() - partner.mineAt < 30000)) return;
  partner.mineAt = Date.now();
  const uid = acct.user.id;
  const [posts, reqs] = await Promise.all([
    sb.from('bracket_partner_posts').select(POST_COLS + ',user_id').eq('user_id', uid).order('end_day'),
    sb.from('bracket_partner_requests').select('id,post_id,from_user,to_user,from_name,rating,contact,message,status,created_at,bracket_partner_posts(title,slug,event,end_day,display_name,status)').order('created_at', { ascending: false })
  ]);
  if(!posts.error) partner.myPosts = (posts.data || []).filter(p => p.end_day >= todayStr());
  if(!reqs.error){
    const all = reqs.data || [];
    partner.inbox = all.filter(r => r.to_user === uid && r.status !== 'declined');
    partner.sent = all.filter(r => r.from_user === uid);
  }
  renderBadge();
  if(ui.tab === 'mine') renderMine(true);
}
const partnerNew = () => partner.inbox.filter(r => r.status === 'sent').length;
let seenBusy = false;
async function markInboxSeen(){
  const ids = partner.inbox.filter(r => r.status === 'sent').map(r => r.id);
  if(!ids.length || !sb || seenBusy || ui.tab !== 'mine') return;
  seenBusy = true;
  setTimeout(async () => {
    const { error } = await sb.from('bracket_partner_requests').update({ status: 'seen' }).in('id', ids);
    if(!error){ partner.inbox.forEach(r => { if(ids.includes(r.id)) r.status = 'seen'; r._new = ids.includes(r.id) || r._new; }); renderBadge(); }
    seenBusy = false;
  }, 1500);
}
function contactLinks(c){
  c = String(c || '').trim();
  if(/@/.test(c)) return `<a class="btn sm ghost" href="mailto:${esc(c)}">${icon('chat')}Email</a>`;
  const d = c.replace(/\D/g, '');
  if(d.length >= 10){ const n = d.length === 10 ? '+1' + d : '+' + d; return `<a class="btn sm ghost" href="sms:${n}">${icon('chat')}Text</a><a class="btn sm ghost" href="tel:${n}">${icon('phone')}Call</a>`; }
  return '';
}
function partnerBlock(t, events){
  const posts = (partner.bySlug[t.slug] || []).filter(p => p.status === 'open' || (acct.user && p.user_id === acct.user.id));
  const loading = partner.loading[t.slug] && !partner.bySlug[t.slug];
  const me = acct.user && acct.user.id;
  const asked = new Set(partner.sent.map(r => r.post_id));
  const mineOpen = posts.some(p => p.user_id === me && p.status === 'open');
  const others = posts.filter(p => p.user_id !== me);
  let h = '';
  if(loading) h += '<div class="skel sm"></div>';
  else if(!posts.length) h += `<p class="desc" style="margin-bottom:10px">Nobody's looking yet. Post that you need a partner and other players can ask to team up.</p>`;
  posts.forEach(p => {
    const mine = p.user_id === me;
    const myR = ratingFor(kindOfName(p.event)); const near = myR != null && p.rating != null && Math.abs(p.rating - myR) <= 0.25 && !mine;
    h += `<div class="pp${near ? ' near' : ''}"><div class="pp-top"><b>${esc(p.display_name)}</b>${p.rating != null ? `<span class="tag info">${rt(p.rating)}</span>` : ''}${near ? '<span class="yl" style="margin:0">Close to your rating</span>' : ''}${mine ? `<span class="tag reg">${p.status === 'found' ? 'Found a partner' : 'Your post'}</span>` : ''}</div>
      <div class="pp-ev">${esc(p.event)}</div>${p.note ? `<p>${esc(p.note)}</p>` : ''}
      <div class="pp-foot"><span>Posted ${relAgo(p.created_at)}</span>${mine ? `<button class="linkbtn" data-act="tab" data-tab="mine">Manage in Mine</button>` : `<button class="linkbtn" data-act="p-report" data-id="${esc(p.id)}">Report</button>`}</div>
      ${mine ? '' : asked.has(p.id) ? `<div class="acts"><span class="tag open">✓ You asked</span></div>` : `<div class="acts"><button class="btn sm primary" data-act="p-ask" data-id="${esc(p.id)}" data-slug="${esc(t.slug)}">${icon('people')}Ask to team up</button></div>`}</div>`;
  });
  if(!acct.user) h += `<button class="gbtn" data-act="signin" style="margin-top:6px">${GOOGLE_G}Sign in to post or ask</button><p class="fine">Anyone can look. Signing in keeps it to real players.</p>`;
  else if(!mineOpen) h += `<button class="btn ghost wide" data-act="p-new" data-slug="${esc(t.slug)}" style="margin-top:6px">${icon('people')}I'm looking for a partner</button>`;
  h += `<p class="fine">Only your first name, last initial, rating and note are shown. Contact info is shared only with the player you ask.</p>`;
  return h;
}
let partnerSheet = null;

  const t = findT(slug);

function eventChoices(slug){

function openNewPost(slug){

/* ---------------- Sheets ---------------- */
const sheets = [];
function openSheet({ title, body, foot, cls = '', onClose }){
  const root = $('#sheets');
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const el = document.createElement('div');
  el.className = 'sheet ' + cls;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="sheet-head"><div class="grab"></div><div class="sheet-title"><h2>${title ? esc(title) : ''}</h2><button class="close" data-act="close-sheet" aria-label="Close">${icon('x')}</button></div></div>
    <div class="sheet-body">${body || ''}</div>${foot != null ? `<div class="sheet-foot">${foot}</div>` : ''}`;
  const z = 60 + sheets.length * 2;
  scrim.style.zIndex = z; el.style.zIndex = z + 1;
  root.append(scrim, el);
  el._scrim = scrim; el._onClose = onClose;
  sheets.push(el);
  scrim.addEventListener('click', () => closeSheet(el));
  enableDrag(el, () => closeSheet(el));
  document.documentElement.classList.add('locked');
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('open'); el.classList.add('open'); }));
  return el;
}
function closeSheet(el, instant){
  const i = sheets.indexOf(el);
  if(i < 0) return;
  sheets.splice(i, 1);
  el.style.transform = '';
  el.classList.remove('open'); el._scrim.classList.remove('open');
  const done = () => { el.remove(); el._scrim.remove(); };
  if(instant) done(); else setTimeout(done, 460);
  if(!sheets.length) document.documentElement.classList.remove('locked');
  if(el._onClose) el._onClose();
}
function closeAllSheets(){ while(sheets.length) closeSheet(sheets[sheets.length - 1], true); }
function enableDrag(sheet, close){
  const head = $('.sheet-head', sheet), body = $('.sheet-body', sheet);
  let y0 = null, dy = 0, t0 = 0, fromBody = false;
  const start = (y, fb) => { y0 = y; dy = 0; t0 = Date.now(); fromBody = fb; };
  const move = (y, e) => {
    if(y0 == null) return;
    dy = y - y0;
    if(fromBody && (body.scrollTop > 0 || dy < 0)){ y0 = null; sheet.style.transition = ''; sheet.style.transform = ''; return; }
    dy = Math.max(0, dy);
    if(dy > 4){ if(e.cancelable) e.preventDefault(); sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
  };
  const end = () => {
    if(y0 == null) return;
    sheet.style.transition = '';
    const v = dy / Math.max(1, Date.now() - t0);
    if(dy > 120 || (v > 0.6 && dy > 30)) close(); else sheet.style.transform = '';
    y0 = null;
  };
  head.addEventListener('touchstart', e => { if(!e.target.closest('button')) start(e.touches[0].clientY, false); }, { passive: true });
  head.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  head.addEventListener('touchend', end);
  body.addEventListener('touchstart', e => { if(body.scrollTop <= 0 && !e.target.closest('input,select,.citylist,.chips')) start(e.touches[0].clientY, true); }, { passive: true });
  body.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  body.addEventListener('touchend', end);
}

function nearestCity(lat, lng){
  let best = null;
  CITIES.forEach(c => { const d = miles({ lat, lng }, { lat: c[1], lng: c[2] }); if(!best || d < best.d) best = { name: c[0], d }; });
  return best;
}
function cityRows(q){
  const sel = S.home && S.home.src === 'city' ? S.home.name : '';

  if(!list.length) return `<div class="city" style="color:var(--sub);font-weight:500">No Michigan city by that name in the list. Try a nearby bigger city, or use your location.</div>`;
  return list.map(c => `<button class="city" data-act="city" data-name="${esc(c[0])}" aria-pressed="${c[0] === sel}">${esc(c[0])}${c[0] === sel ? icon('check') : ''}</button>`).join('');
}

function useLocation(btn){
  if(!navigator.geolocation){ toast("This browser can't share location. Pick a city instead."); return; }
  const orig = btn.innerHTML;
  btn.innerHTML = 'Finding you…'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    btn.innerHTML = orig; btn.disabled = false;
    const lat = +pos.coords.latitude.toFixed(3), lng = +pos.coords.longitude.toFixed(3);
    const n = nearestCity(lat, lng);
    setHome({ name: n && n.d < 20 ? 'Near ' + n.name : 'My location', near: n && n.d < 20 ? n.name : null, lat, lng, src: 'gps' });
  }, () => {
    btn.innerHTML = orig; btn.disabled = false;
    toast("Couldn't get your location. Pick a city instead.");
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 3600000 });
}

/* ---------------- Welcome (first run) ---------------- */
function showWelcome(){
  const w = $('#welcome');
  w.hidden = false;
  w.innerHTML = `<div class="wcard">
    <div class="whero"><div class="kicker">MICHIGAN PICKLEBALL TOURNAMENTS</div><h1>Bracket</h1><p>Every tournament in one place, easy to browse.</p></div>
    <section class="wsec glass"><h2>Where do you play from?</h2><p>So Bracket can show how far each tournament is.</p>${locPicker()}</section>
    <section class="wsec glass"><h2>Your rating <span style="font:600 13px var(--font);color:var(--faint)">optional</span></h2><p>Your DUPR, or the level you usually play. Bracket uses it to find events at your level. Not sure? Leave it as “Not set”.</p>${ratingSelect('wRating')}</section>
    <div class="wfoot"><button class="btn primary wide" data-act="welcome-done">Show tournaments</button><button class="linkbtn" data-act="welcome-done">Skip for now</button></div>
    <p class="wfine">Unofficial. Tournament data from pickleballtournaments.com.<br>Your choices stay on this phone.</p>
  </div>`;
}
function finishWelcome(){
  S.onboarded = true;
  saveSettings();
  const w = $('#welcome');
  w.style.transition = 'opacity .3s'; w.style.opacity = '0';
  setTimeout(() => { w.hidden = true; w.style.opacity = ''; w.innerHTML = ''; }, 300);
  renderAll();
  maybeAutoInstall();
}

/* ---------------- Saves ---------------- */
let toastTimer = null, toastUndo = null;
function toast(msg, undo){
  const el = $('#toast');
  toastUndo = undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 4500 : 2600);
}
function toggleInterested(slug){
  const t = findT(slug);
  if(SAVES.interested[slug]){
    const prev = SAVES.interested[slug];
    delete SAVES.interested[slug]; saveSaves();
    toast('Removed from Interested', () => { SAVES.interested[slug] = prev; saveSaves(); afterSaveChange(); });
  } else {
    if(t.placeholder) return;
    SAVES.interested[slug] = withAlerts(snap(t), SAVES.registered[slug]); saveSaves();
    toast('Saved to Interested');
  }
  afterSaveChange();
}
function toggleRegistered(slug){
  const t = findT(slug);
  if(SAVES.registered[slug]){
    const prev = SAVES.registered[slug];
    delete SAVES.registered[slug]; saveSaves();
    toast('No longer marked registered', () => { SAVES.registered[slug] = prev; saveSaves(); afterSaveChange(); });
  } else {
    if(t.placeholder) return;
    SAVES.registered[slug] = withAlerts(snap(t), SAVES.interested[slug]); saveSaves();
    toast("Marked as registered. You'll find it in Mine.");
  }
  afterSaveChange();
}
function afterSaveChange(){
  renderBadge();
  if(ui.tab === 'browse') renderList();
  if(ui.tab === 'mine') renderMine();
  if(ui.tab === 'settings') renderSettings();
  refreshOpenDetail();
}

/* ---------------- Tabs + render ---------------- */
function setTab(tab){
  if(tab === ui.tab){
    if(tab === 'settings' && ui.spage){ ui.spage = null; renderSettings(); }
    window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  ui.scroll[ui.tab] = window.scrollY;
  ui.tab = tab;
  const i = ['browse', 'mine', 'settings'].indexOf(tab);
  $('#tabs').style.setProperty('--i', i);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  renderView();
  window.scrollTo(0, ui.scroll[tab] || 0);
  requestAnimationFrame(updateBars);
}
function renderView(){
  if(ui.tab === 'browse') renderBrowse();
  else if(ui.tab === 'mine') renderMine();
  else renderSettings();
}
function renderAll(){
  renderView(); renderBadge();
  if(isWide()) renderPanel(); else refreshOpenDetail();
}
function goSettingsPage(p){
  closeAllSheets();
  if(isWide()){ ui.openSlug = null; renderPanel(); }
  if(ui.tab !== 'settings') setTab('settings');
  openSPage(p);
}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act], .seg button');
  if(!el) return;
  const seg = el.closest('.seg');
  if(seg && el.tagName === 'BUTTON' && !el.dataset.act){
    const name = seg.dataset.seg, v = el.dataset.v;
    const idx = [...seg.querySelectorAll('button')].indexOf(el);
    seg.style.setProperty('--i', idx); seg.classList.remove('none');
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
    onSeg(name, v);
    return;
  }
  const act = el.dataset.act, slug = el.dataset.slug;
  switch(act){
    case 'open': if(!e.target.closest('.star')) openTournament(slug); break;
    case 'star': e.stopPropagation(); toggleInterested(slug); break;
    case 'reg': toggleRegistered(slug); break;
    case 'tab': setTab(el.dataset.tab); break;
    case 'filters': openFilters(); break;
    case 'clear-filter': {
      const k = el.dataset.k;
      if(k === 'when'){ S.filters.when = 'any'; S.filters.wk = null; S.filters.from = null; S.filters.to = null; }
      else S.filters[k] = Array.isArray(DEFAULT_FILTERS[k]) ? [] : DEFAULT_FILTERS[k];
      filtersChanged(true); break;
    }
    case 'quick': {
      const k = el.dataset.k;
      if(k === 'wk'){ S.filters.when = 'wk'; S.filters.wk = weekends(1)[0]; }
      if(k === 'open') S.filters.openOnly = true;
      if(k === 'level') S.filters.level = 'fit';
      filtersChanged(true); break;
    }
    case 'reset-filters': S.filters = Object.assign({}, DEFAULT_FILTERS, { formats: [] }); filtersChanged(true); break;
    case 'reset-all-filters': S.filters = Object.assign({}, DEFAULT_FILTERS, { formats: [] }); ui.q = ''; $('#q').value = ''; $('#qx').hidden = true; filtersChanged(true); break;
    case 'lvl': S.filters.level = el.dataset.v || null; filtersChanged(true); break;
    case 'fx': ui.fx[el.dataset.v] = !ui.fx[el.dataset.v]; filtersChanged(true); break;
    case 'when': S.filters.when = el.dataset.v; S.filters.wk = null; S.filters.from = null; S.filters.to = null; filtersChanged(true); break;
    case 'wk': {
      const v = el.dataset.v;
      if(S.filters.when === 'wk' && S.filters.wk === v){ S.filters.when = 'any'; S.filters.wk = null; }
      else { S.filters.when = 'wk'; S.filters.wk = v; S.filters.from = null; S.filters.to = null; }
      ui.calMonth = null; ui.calDay = S.filters.when === 'wk' ? v : null;
      filtersChanged(true); break;
    }
    case 'fmt': {
      const v = el.dataset.v, f = S.filters.formats;
      S.filters.formats = f.includes(v) ? f.filter(x => x !== v) : f.concat(v);
      el.setAttribute('aria-pressed', S.filters.formats.includes(v));
      filtersChanged(false); break;
    }
    case 'sw-open': S.filters.openOnly = !S.filters.openOnly; el.setAttribute('aria-checked', S.filters.openOnly); filtersChanged(false); break;
    case 'sw-fit': S.fit = !S.fit; saveSettings(); document.querySelectorAll('[data-act="sw-fit"]').forEach(x => x.setAttribute('aria-checked', S.fit)); refreshOpenDetail(); break;
    case 'refresh': fetchList(true); break;
    case 'clear-q': ui.q = ''; $('#q').value = ''; $('#qx').hidden = true; renderList(); $('#q').focus(); break;
    case 'close-sheet': { const s = el.closest('.sheet'); if(s) closeSheet(s); break; }
    case 'close-panel': ui.openSlug = null; renderPanel(); document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); break;
    case 'retry-detail': loadDetail(slug, true); break;
    case 'more': ui.descOpen = true; refreshOpenDetail(); break;
    case 'evmine': ui.evMine = !ui.evMine; refreshOpenDetail(); break;
    case 'sw-cardline': S.cardLine = !S.cardLine; el.setAttribute('aria-checked', S.cardLine); save(LS.settings, S); break;
    case 'evall': ui.evAll = !ui.evAll; refreshOpenDetail(); break;
    case 'go-partners': goSettingsPage('partners'); break;
    case 'sp-partners': openSPage('partners'); break;
    case 'p-add': S.partners.push({ id: Math.random().toString(36).slice(2, 8), name: '', rating: null, kind: 'mixed' }); saveSettings(); renderSettings(); { const ins = document.querySelectorAll('[data-pname]'); if(ins.length) ins[ins.length - 1].focus(); } break;
    case 'p-remove': S.partners = S.partners.filter(x => x.id !== el.dataset.pid); saveSettings(); renderSettings(); toast('Partner removed'); break;
    case 'home': openHome(); break;
    case 'go-home': goSettingsPage('home'); break;
    case 'go-rating': goSettingsPage('rating'); break;
    case 'geo': useLocation(el); break;
    case 'city': {
      const c = CITIES.find(x => x[0] === el.dataset.name);
      if(c) setHome({ name: c[0], lat: c[1], lng: c[2], src: 'city' });
      break;
    }
    case 'cal-prev': case 'cal-next': {
      const [y, m] = ui.calMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + (act === 'cal-next' ? 1 : -1), 1);
      ui.calMonth = d.getFullYear() + '-' + pad(d.getMonth() + 1); ui.calDay = null;
      renderList(); break;
    }
    case 'cal-day': ui.calDay = el.dataset.day; renderList(); break;
    case 'sp-home': openSPage('home'); break;
    case 'sp-rating': openSPage('rating'); break;
    case 'sp-looks': openSPage('looks'); break;
    case 'sp-help': openSPage('help'); break;
    case 'sp-about': openSPage('about'); break;
    case 'sp-data': openSPage('data'); break;
    case 'sp-back': ui.spage = null; renderSettings(); window.scrollTo(0, 0); break;
    case 'clear-saves':
      if(confirm('Clear all saved tournaments on this phone? Interested, Registered and History will be emptied.')){
        SAVES = { interested: {}, registered: {} }; saveSaves(); afterSaveChange(); toast('Saved tournaments cleared');
      }
      break;
    case 'reset-app':
      if(confirm('Start over? This clears your home, rating, filters and saved tournaments on this phone.')){
        [LS.settings, LS.saves, LS.list, LS.details].forEach(k => { try { localStorage.removeItem(k); } catch(err){} });
        location.reload();
      }
      break;
    case 'welcome-done': finishWelcome(); break;
    case 'seen-all': changedSlugs().forEach(markSeen); afterSaveChange(); toast('All caught up'); break;
    case 'share': shareTournament(slug); break;
    case 'share-app': shareApp(); break;
    case 'addcal': openAddCal(slug); break;
    case 'install': openInstall(); break;
    case 'sp-notify': openSPage('notify'); break;
    case 'go-notify': goSettingsPage('notify'); break;
    case 'sw-push': if(pushState.on) disablePush(); else enablePush(); break;
    case 'push-test': testPush(el); break;
    case 'sw-notify': { const k = el.dataset.k; S.notify[k] = !S.notify[k]; el.setAttribute('aria-checked', S.notify[k]); saveSettings(); break; }
    case 'alerts': openAlerts(slug); break;
    case 'alerts-save': toggleInterested(slug); refreshAlertSheet(); break;
    case 'alerts-reset': setAlerts(slug, null); refreshAlertSheet(); refreshOpenDetail(); break;
    case 'alert-all': { const a = savedAlerts(slug); setAlerts(slug, a === 'off' ? null : 'off'); refreshAlertSheet(); refreshOpenDetail(); break; }
    case 'alert-k': {
      const k = el.dataset.k, cur = savedAlerts(slug);
      const next = Object.assign({}, cur && typeof cur === 'object' ? cur : {});
      next[k] = !alertOn(slug, k);
      if(next[k] === !!S.notify[k]) delete next[k];
      setAlerts(slug, Object.keys(next).length ? next : null); refreshAlertSheet(); refreshOpenDetail(); break;
    }
    case 'signin': signIn(); break;
    case 'signout': signOut(); break;
    case 'del-account': deleteAccount(); break;
    case 'sync-now': pullSync(); break;
    case 'sp-account': openSPage('account'); break;
    case 'sp-feedback': ui.fb = { kind: 'idea' }; openSPage('feedback'); break;
    case 'fb-again': ui.fb = { kind: 'idea' }; renderSettings(); break;
    case 'fbkind': ui.fb.kind = el.dataset.v; document.querySelectorAll('[data-act="fbkind"]').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'fbsend': sendFeedback(el); break;
    case 'p-open': openPartners(slug); break;
    case 'p-new': if(!acct.user){ signIn(); break; } openNewPost(slug); break;
    case 'p-ev': {
      ui.pEvent = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b === el));
      const r = ratingFor(kindOfName(ui.pEvent)), sel = $('#pRating'); if(sel) sel.value = r != null ? (+r).toFixed(2) : '';
      break;
    }
    case 'p-post': submitPost(el, slug); break;
    case 'p-ask': if(!acct.user){ signIn(); break; } openAsk(el.dataset.id, slug); break;
    case 'p-send': submitAsk(el, el.dataset.id, slug); break;
    case 'p-found': postFound(el.dataset.id); break;
    case 'p-del': postDelete(el.dataset.id); break;
    case 'p-hide': requestHide(el.dataset.id); break;
    case 'p-withdraw': requestWithdraw(el.dataset.id); break;
    case 'p-report': reportPost(el.dataset.id); break;
    case 'undo': if(toastUndo){ const u = toastUndo; toastUndo = null; u(); $('#toast').classList.remove('show'); } break;
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('.card[data-act="open"]')){ openTournament(e.target.dataset.slug); }
  if(e.key === 'Escape'){
    if(sheets.length) closeSheet(sheets[sheets.length - 1]);
    else if(isWide() && ui.openSlug){ ui.openSlug = null; renderPanel(); document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); }
  }
  if(e.key === '/' && !e.target.closest('input') && ui.tab === 'browse' && !sheets.length){ e.preventDefault(); $('#q').focus(); }
});
function onSeg(name, v){
  if(name === 'mine'){ S.mineTab = v; saveSettings(); renderMine(); }
  else if(name === 'view'){ S.view = v; saveSettings(); renderList(); }
  else if(name === 'startview'){ S.view = v; saveSettings(); }
  else if(name.startsWith('pkind:')){ const pr = S.partners.find(x => x.id === name.slice(6)); if(pr){ pr.kind = v === 'doubles' ? 'doubles' : 'mixed'; saveSettings(); refreshOpenDetail(); } }
  else if(name === 'flevel'){ S.filters.level = v || null; filtersChanged(false); }
  else if(name === 'size'){ S.size = v; saveSettings(); window.BracketLooks(S.mode, v); }
  else if(name === 'mode'){
    const was = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content;
    S.mode = v; saveSettings(); window.BracketLooks(v, S.size);
    // iPhone only reads the status-bar colors when the app opens, so the clock/battery
    // colors catch up next time. (bracket-1 to -3 reloaded here, which jumped back to Browse.)
    const now = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content;
    if(isStandalone() && was !== now) toast('The time and battery at the top will match next time you open Bracket.');
  }
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-rating]') && (t.id === 'pRating' || t.id === 'aRating')) return;
  if(t.matches('[data-prating]')){
    const pr = S.partners.find(x => x.id === t.dataset.prating);
    if(pr){ pr.rating = t.value ? parseFloat(t.value) : null; saveSettings(); renderSettings(); refreshOpenDetail(); }
    return;
  }
  if(t.matches('[data-rating-kind]')){
    const k = t.dataset.ratingKind;
    S.ratings[k] = t.value ? parseFloat(t.value) : null;
    if(!hasRating()) S.filters.level = null;
    saveSettings();
    toast(S.ratings[k] != null ? kindName(k) + ' rating set to ' + rt(S.ratings[k]) : kindName(k) + ' now uses your general rating');
    refreshOpenDetail();
  } else if(t.matches('[data-rating]')){
    S.rating = t.value ? parseFloat(t.value) : null;
    if(!hasRating()) S.filters.level = null;
    saveSettings();
    if(t.id === 'ratingSel') toast(S.rating != null ? 'Rating set to ' + rt(S.rating) : 'Rating cleared');
    refreshOpenDetail();
  } else if(t.dataset.date){
    const f = S.filters;
    const from = $('[data-date="from"]', t.closest('.datein')).value, to = $('[data-date="to"]', t.closest('.datein')).value;
    if(from || to){
      let a = from || to, b = to || from;
      if(b < a) [a, b] = [b, a];
      f.when = 'range'; f.from = a; f.to = b; f.wk = null;
      ui.calMonth = a.slice(0, 7); ui.calDay = a;
    } else { f.when = 'any'; f.from = f.to = null; }
    filtersChanged(true);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){
    ui.q = t.value.trim(); $('#qx').hidden = !t.value;
    renderList();
    if(filterSheet) $('.sheet-foot', filterSheet).innerHTML = filterFoot();
  } else if(t.matches('[data-pname]')){
    const pr = S.partners.find(x => x.id === t.dataset.pname);
    if(pr){ pr.name = t.value.slice(0, 30); save(LS.settings, S); scheduleProfile(); }
  } else if(t.matches('[data-city-q]')){
    const cl = t.closest('.wsec, .sheet-body, .group').querySelector('.citylist');
    cl.innerHTML = cityRows(t.value.trim());
  } else if(t.dataset.range){
    const v = +t.value;
    if(t.dataset.range === 'price'){
      S.filters.maxPrice = v >= PRICE.max ? null : v;
      t.style.setProperty('--p', ((v - PRICE.min) / (PRICE.max - PRICE.min) * 100) + '%');
      $('#pLbl').textContent = S.filters.maxPrice == null ? 'Any price' : '$' + v;
    } else {
      S.filters.maxDist = v >= DIST.max ? null : v;
      t.style.setProperty('--p', ((v - DIST.min) / (DIST.max - DIST.min) * 100) + '%');
      $('#dLbl').textContent = S.filters.maxDist == null ? 'All of Michigan' : v + ' miles';
    }
    filtersChanged(false);
  }
});
document.addEventListener('submit', e => e.preventDefault());


/* Status-bar strip and the search bar's frosted background follow the scroll position.
   Checked on scroll, on tab change and after every Browse render, so it can't get stuck. */
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
document.body.appendChild(probe);
function updateBars(){
  const sat = probe.offsetHeight;
  $('#sbar').classList.toggle('on', window.scrollY > 4);
  const bar = $('#bar'), sent = $('#barSentinel');
  if(ui.tab === 'browse' && bar && sent) bar.classList.toggle('stuck', sent.getBoundingClientRect().top < sat - 0.5);
}
addEventListener('scroll', updateBars, { passive: true });
addEventListener('resize', updateBars);

if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const f = () => { if(S.mode === 'auto') window.BracketLooks('auto', S.size); };
  mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f);
  const wide = matchMedia('(min-width: 900px)');
  const w = () => {
    if(detailSheet && wide.matches){ const s = ui.openSlug; closeSheet(detailSheet, true); ui.openSlug = s; }
    renderAll();
  };
  wide.addEventListener ? wide.addEventListener('change', w) : wide.addListener(w);
}

// Coming back to the app: refresh quietly if the list is old
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  loadConfig();
  if(acct.user && Date.now() - acct.lastSync > 60000) pullSync();
  loadPartnerCounts(); loadPartnerMine();
  if(!LIST || Date.now() - (LIST.savedAt || 0) > LIST_MAX_AGE) fetchList(false);
});

/* ---------------- Start ---------------- */
(function boot(){
  Object.keys(DET).forEach(k => { if(!DET[k] || Date.now() - DET[k].at > 2 * 864e5) delete DET[k]; });
  // A weekend or date range that's already over shouldn't stick around
  const f = S.filters, td = todayStr();
  if((f.when === 'wk' && f.wk && addDays(f.wk, 1) < td) || (f.when === 'range' && f.to && f.to < td)){ f.when = 'any'; f.wk = f.from = f.to = null; }
  saveSettings();
  renderAll(); updateBars();
  if(!LIST || Date.now() - (LIST.savedAt || 0) > LIST_MAX_AGE) fetchList(false);
  // Notifications: the service worker shows them; a partner-request alert opens /?mine=1
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  checkPush();
  if(/[?&]mine=1/.test(location.search)){ history.replaceState(null, '', '/'); setTab('mine'); }
  // Shared links: /t/<slug>, ?t=<slug> or #t=<slug>. Someone new sees the tournament first, the welcome after.
  const m = /^\/t\/([a-z0-9-]+)/i.exec(location.pathname) || /[?#&]t=([a-z0-9-]+)/i.exec(location.search + location.hash);
  if(m){
    if(!S.onboarded) ui.welcomeLater = true;
    openTournament(m[1]);
  } else if(!S.onboarded) showWelcome();
  else maybeAutoInstall();
  // Coming back from Google sign-in: return to the Account page
  try {
    const back = JSON.parse(sessionStorage.getItem('bracket_restore') || 'null');
    sessionStorage.removeItem('bracket_restore');
    if(back && back.tab && /[?&]code=/.test(location.search)){ setTab(back.tab); if(back.spage) openSPage(back.spage); }
  } catch(e){}
  loadConfig();
})();
